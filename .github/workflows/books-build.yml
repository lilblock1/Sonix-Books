name: Sonix Books checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  r1-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published R1 base and device ELF
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full squashfs-tools binutils genisoimage
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/Jepl4r/sonix-player/releases/download/1.3.0/r1.upt --output base.upt
          python3 - <<'PY'
          import importlib.util, json, pathlib, subprocess
          path = pathlib.Path('sonix-player/tools/r1_candidate.py')
          spec = importlib.util.spec_from_file_location('candidate', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.digest(pathlib.Path('base.upt').read_bytes()) == module.BASE_SHA256
          module.run('7z', 'x', 'base.upt', '-obase-iso', '-y')
          _, images = module.verify_images(pathlib.Path('base-iso/ota_v0'))
          pathlib.Path('base.squashfs').write_bytes(images['rootfs.squashfs'])
          module.run('unsquashfs', '-no-progress', '-d', 'base-root', 'base.squashfs',
                     'usr/bin/sonix_player', module.INFO)
          info = json.loads((pathlib.Path('base-root') / module.INFO).read_text())
          assert info['device-name'] == 'HiBy R1' and info['OS_version'] == '1.3.0'
          module.check_elf(pathlib.Path('base-root/usr/bin/sonix_player'))
          assert images['xImage'] == pathlib.Path('sonix-packer/kernel/xImage-R1').read_bytes()
          print('Pinned base, both image hash chains, model, version, MIPS/glibc and kernel match passed')
          PY
      - name: Exercise the packer with the published player as a fixture
        run: |
          # This tests packaging only. It is never uploaded or published as firmware.
          sudo python3 sonix-player/tools/r1_candidate.py --base base.upt \
            --player base-root/usr/bin/sonix_player --output packer-fixture
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config libsdl2-dev libfreetype-dev libopusfile-dev libwavpack-dev libasound2-dev
      - name: Test persistent reading history
        working-directory: sonix-player
        run: |
          mkdir -p build_tests
          gcc -std=c11 -Wall -Wextra -Werror -I. \
            tests/test_ebookhistory.c src/system/ebook/ebookhistory.c \
            src/system/ebook/bookmarks.c src/system/core/config.c \
            -o build_tests/test_ebookhistory
          ./build_tests/test_ebookhistory
      - name: Test library search, folders, sorting and metadata cache
        working-directory: sonix-player
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I. \
            tests/test_ebooklibrary.c src/system/ebook/ebooklibrary.c \
            -o build_tests/test_ebooklibrary
          fixture=$(mktemp -d)
          trap 'rm -rf -- "$fixture"' EXIT
          ./build_tests/test_ebooklibrary "$fixture"
      - name: Check language resources and fork update destination
        run: python3 sonix-player/tests/check_resources.py
      - name: Test Wi-Fi update policy
        working-directory: sonix-player
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I. tests/test_ota_policy.c \
            src/system/device/ota_policy.c -o build_tests/test_ota_policy
          ./build_tests/test_ota_policy
      - name: Test firmware chunk verification
        run: python3 sonix-player/tests/test_r1_candidate.py
      - name: Build the complete Linux simulator
        working-directory: sonix-player
        run: make host -j2
      - name: Stage R1 simulator resources
        run: |
          cp -a sonix-packer/assets/R1/usr sonix-player/usr
          mkdir -p sonix-player/simulator-card/Ebook sonix-player/simulator-card/Games/GB sonix-player/simulator-card/Games/GBC
      - name: Smoke test simulator startup
        working-directory: sonix-player
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SONIX_NO_MOUNT: '1'
          SONIX_NO_SYSSERVER: '1'
          SONIX_SD_ROOT: simulator-card
          SONIX_CONFIG: simulator-card/device_config.ini
          SONIX_EBOOK_CONFIG: simulator-card/ebook_config.ini
        run: |
          set +e
          timeout --signal=TERM 10s ./sonix_player_host > simulator-startup.log 2>&1
          result=$?
          set -e
          cat simulator-startup.log
          test "$result" -eq 124
      - name: Upload Linux simulator (not firmware)
        uses: actions/upload-artifact@v4
        with:
          name: sonix-books-linux-simulator
          path: |
            sonix-player/sonix_player_host
            sonix-player/usr/resource
            sonix-player/simulator-startup.log
          retention-days: 14
