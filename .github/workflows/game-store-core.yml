name: Build one Sonix game core (no firmware)
on:
  push:
    branches: [game-store-content]
    paths: ['game-store/core-request.json']
permissions:
  contents: read
concurrency:
  group: sonix-game-store
  cancel-in-progress: false
jobs:
  core:
    if: contains(github.event.head_commit.message, '[game-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out the exact Update 12 firmware package contract
        uses: actions/checkout@v4
        with:
          ref: 2d5f434b31a9c582ed826c1fb31c5914f0a846d0
          path: firmware-contract
      - uses: actions/cache/restore@v4
        with:
          path: sonix-player/rockbox-toolchain
          key: r1-player-toolchain-ubuntu24-${{ hashFiles('sonix-player/rockboxdev/**') }}
      - name: Build and validate only the requested native core
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          r=json.loads(Path('game-store/core-request.json').read_text())
          assert re.fullmatch(r'[a-z0-9](?:[a-z0-9-]{0,29}[a-z0-9])?',r['id'])
          assert re.fullmatch(r'v(?:0|[1-9][0-9]{0,8})\.(?:0|[1-9][0-9]{0,8})\.(?:0|[1-9][0-9]{0,8})',r['version'])
          assert (Path('game-store/cores')/r['id']/'Makefile').is_file()
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('CORE_ID='+r['id']+'\nCORE_VERSION='+r['version']+'\n')
          PY
      - name: Check out pinned QuickNES source
        if: env.CORE_ID == 'quicknes'
        uses: actions/checkout@v4
        with:
          repository: libretro/QuickNES_Core
          ref: 26bb785c9deddb66a17717b21bb4e328f03ade32
          path: quicknes-upstream
          persist-credentials: false
      - name: Check out pinned gpSP source
        if: env.CORE_ID == 'gpsp'
        uses: actions/checkout@v4
        with:
          repository: libretro/gpsp
          ref: 5819380c2ffb0900219d700a382ee68c464ebb99
          path: gpsp-upstream
          persist-credentials: false
      - name: Install fallback MIPS compiler if the firmware cache is unavailable
        run: |
          if [ ! -x sonix-player/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc ]; then
            sudo apt-get update
            sudo apt-get install -y gcc-mipsel-linux-gnu g++-mipsel-linux-gnu binutils-mipsel-linux-gnu libc6-dev-mipsel-cross
          fi
      - name: Compile MIPS core and verify exported ABI and runtime dependencies
        run: |
          set -eu
          compiler="$PWD/sonix-player/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-"
          if [ ! -x "${compiler}gcc" ]; then compiler=mipsel-linux-gnu-; fi
          command -v "${compiler}gcc"
          dir="game-store/cores/$CORE_ID"
          upstream="$PWD/$CORE_ID-upstream"
          make -C "$dir" check UPSTREAM="$upstream" CORE_VERSION="$CORE_VERSION"
          staging="$PWD/core-stage/Games/$CORE_ID"
          mkdir -p "$staging"
          if [ "$CORE_ID" = quicknes ] || [ "$CORE_ID" = gpsp ]; then command -v "${compiler}g++"; fi
          make -C "$dir" core CC="${compiler}gcc" CXX="${compiler}g++" UPSTREAM="$upstream" OUT="$staging/core.so" CFLAGS="-Os -march=mips32r2 -mno-madd4 -mplt -ffunction-sections -fdata-sections" CORE_VERSION="$CORE_VERSION"
          "${compiler}readelf" -h -d -l -V -Ws "$staging/core.so" > core-elf.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('core-elf.txt').read_text()
          assert 'ELF32' in s and 'little endian' in s and 'MIPS' in s
          assert re.search(r'Type:\s+DYN',s)
          assert 'Requesting program interpreter' not in s
          assert all(tuple(map(int,v)) <= (2,19) for v in re.findall(r'GLIBC_(\d+)\.(\d+)',s))
          needed=set(re.findall(r'Shared library: \[([^\]]+)\]',s))
          import os
          allowed={'libc.so.6','libm.so.6','libgcc_s.so.1'}
          if os.environ['CORE_ID'] in ('quicknes','gpsp'): allowed.add('ld.so.1') # additionally checked against pinned firmware below
          assert needed <= allowed,needed
          for symbol in ('retro_api_version','retro_init','retro_deinit','retro_load_game','retro_unload_game','retro_run','retro_get_system_info','retro_get_system_av_info','retro_set_environment','retro_set_video_refresh','retro_set_input_poll','retro_set_input_state','retro_set_audio_sample','retro_set_audio_sample_batch','retro_serialize_size','retro_serialize','retro_unserialize','retro_get_memory_data','retro_get_memory_size'):
              assert any(re.search(r'\b'+symbol+r'$',line) and ' UND ' not in line and ' GLOBAL ' in line for line in s.splitlines()),symbol
          PY
          "${compiler}strip" --strip-unneeded "$staging/core.so"
          mkdir -p "$staging/source"
          if [ "$CORE_ID" = quicknes ]; then
            git -C quicknes-upstream archive --format=tar.gz --prefix=QuickNES_Core/ HEAD > "$staging/source/quicknes-upstream.tar.gz"
            cp "$dir"/Makefile "$dir"/smoke.c "$dir"/UPSTREAM.txt "$dir"/optimize.py "$staging/source/"
            cp .github/workflows/game-store-core.yml "$staging/source/"
            cp quicknes-upstream/LICENSE "$staging/LICENSE"
          elif [ "$CORE_ID" = gpsp ]; then
            git -C gpsp-upstream archive --format=tar.gz --prefix=gpsp/ HEAD > "$staging/source/gpsp-upstream.tar.gz"
            cp "$dir"/Makefile "$dir"/smoke.c "$dir"/test_rom.py "$dir"/UPSTREAM.txt "$staging/source/"
            cp .github/workflows/game-store-core.yml "$staging/source/"
            cp gpsp-upstream/COPYING "$staging/LICENSE"
          else
            cp "$dir"/core.c "$dir"/Makefile "$staging/source/"
          fi
          # Optional title artwork: fixed RGB565, no image decoder on R1.
          if [ -f "$dir/logo.py" ]; then
            python3 "$dir/logo.py" "$staging/logo.rgb565"
            cp "$dir/logo.py" "$staging/source/"
          elif [ -f "$dir/logo.rgb565" ]; then
            cp "$dir/logo.rgb565" "$staging/logo.rgb565"
          fi
          if [ -f "$staging/logo.rgb565" ]; then
            test "$(wc -c < "$staging/logo.rgb565")" -eq 4608
          fi
          for license in LICENSE LICENSE.txt COPYING; do
            if [ ! -f "$staging/LICENSE" ] && [ -f "$license" ]; then cp "$license" "$staging/LICENSE"; break; fi
          done
          test -s "$staging/LICENSE"
          cp core-elf.txt "$staging/core-elf.txt"
      - name: Verify emulator dependencies against the exact tested R1 filesystem
        if: env.CORE_ID == 'quicknes' || env.CORE_ID == 'gpsp'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y p7zip-full squashfs-tools python3-pyelftools
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/lilblock1/Sonix-Books/releases/download/v0.3.0.76-test/r1.upt \
            --output verified-r1.upt
          echo 'd69894ae73fe770394f926cc81cde6223d4e87a8380d3df22d6b4b8e6412eb4a  verified-r1.upt' | sha256sum --check
          7z x verified-r1.upt -or1-iso -y >/dev/null
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'firmware-contract/sonix-player/tools')
          from r1_candidate import verify_images
          _,images=verify_images(Path('r1-iso/ota_v0'))
          Path('verified-root.squashfs').write_bytes(images['rootfs.squashfs'])
          PY
          unsquashfs -no-progress -d r1-root verified-root.squashfs lib usr/lib
          test -e r1-root/lib/ld.so.1 || test -e r1-root/usr/lib/ld.so.1
          mkdir -p abi-empty
          /usr/bin/python3 firmware-contract/sonix-player/tools/system-libs/abicheck.py \
            "$PWD/r1-root" "$PWD/abi-empty" "$PWD/core-stage/Games/$CORE_ID/core.so" > "$CORE_ID-r1-abi.txt"
          cat "$CORE_ID-r1-abi.txt"
          cp "$CORE_ID-r1-abi.txt" "core-stage/Games/$CORE_ID/"
      - name: Create independent package and verify real SD installer
        run: |
          set -eu
          mkdir -p game-artifact
          asset="sonix-game-v1-$CORE_ID-$CORE_VERSION.spk"
          if [ -f "core-stage/Games/$CORE_ID/logo.rgb565" ]; then
            cp "core-stage/Games/$CORE_ID/logo.rgb565" "game-artifact/sonix-logo-v1-$CORE_ID-$CORE_VERSION.rgb565"
          fi
          python3 - "$CORE_ID" <<'PY'
          import sys,zipfile
          from pathlib import Path
          root=Path('core-stage')
          with zipfile.ZipFile('game.zip','w',compression=zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): archive.write(p,p.relative_to(root).as_posix())
          PY
          python3 firmware-contract/sonix-player/tools/build_sd_packages.py --game "$CORE_ID" --version "$CORE_VERSION" --output "game-artifact/$asset" game.zip > game-artifact/report.json
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware-contract/sonix-player firmware-contract/sonix-player/tests/sdpackages_driver.c \
            firmware-contract/sonix-player/src/system/device/sdpackages.c firmware-contract/sonix-player/src/system/device/sdpackages_paths.c \
            firmware-contract/sonix-player/src/system/core/json.c firmware-contract/sonix-player/src/system/core/sha256.c -o game-install-check
          card="$(mktemp -d)"
          sha="$(sha256sum "game-artifact/$asset" | cut -d' ' -f1)"
          test "$(./game-install-check "$card" "game-artifact/$asset" "$CORE_VERSION" "$sha" 0 "game:$CORE_ID")" = "0 $CORE_VERSION"
          test "$(find "$card" -name core.so -type f | wc -l)" -eq 1
          core="$(find "$card" -name core.so -type f)"
          test "$(tr -d '\n' < "$(dirname "$core")/.core-sha256")" = "$(sha256sum "$core" | cut -d' ' -f1)"
          cmp "$core" "core-stage/Games/$CORE_ID/core.so"
          cp core-elf.txt game-artifact/
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('game-artifact/report.json')
          r=json.loads(p.read_text())
          r.update(runtime_abi=1,hardware_verified=False,firmware_test='v0.3.0.76-test')
          p.write_text(json.dumps(r,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sonix-game-candidate
          path: game-artifact/
          retention-days: 30

  publish-device-test:
    # Explicit maintainer request for first physical-device testing only.
    # This does not assert hardware approval or publish a stable release.
    needs: core
    if: contains(github.event.head_commit.message, '[game-test]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sonix-game-candidate
          path: candidate
      - name: Validate exact artifact and publish to prerelease catalog
        run: |
          set -eu
          asset="$(python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          request=json.loads(Path('game-store/core-request.json').read_text())
          report=json.loads(Path('candidate/report.json').read_text())
          assert request.get('channel')=='device-test'
          assert (request['id'],request['version']) in {('2048','v1.0.0'),('2048','v1.1.0'),('quicknes','v1.0.0'),('quicknes','v1.1.0'),('gpsp','v1.0.0')}
          assert report['version']==request['version'] and report['runtime_abi']==1 and report['hardware_verified'] is False
          asset='sonix-game-v1-'+request['id']+'-'+request['version']+'.spk'
          assert hashlib.sha256((Path('candidate')/asset).read_bytes()).hexdigest()==report['sha256']
          print(asset)
          PY
          )"
          gh release view sonix-game-store-v1 --json tagName,isDraft,isPrerelease,assets > catalog.json
          ASSET="$asset" python3 - <<'PY'
          import json,os
          r=json.load(open('catalog.json'))
          assert r['tagName']=='sonix-game-store-v1' and r['isPrerelease'] and not r['isDraft']
          assert all(a['name']!=os.environ['ASSET'] for a in r['assets']), 'Version already published; do not overwrite'
          PY
          logo="sonix-logo-v1-$(printf '%s' "$asset" | sed 's/^sonix-game-v1-//;s/\.spk$/.rgb565/')"
          if [ -f "candidate/$logo" ]; then
            test "$(wc -c < "candidate/$logo")" -eq 4608
            gh release upload sonix-game-store-v1 "candidate/$logo"
          fi
          if [ "$asset" = sonix-game-v1-gpsp-v1.0.0.spk ]; then
            gh release upload sonix-game-store-v1 "candidate/$asset#sonix-ui1|emulator|gpSP|Experimental GBA emulator with open BIOS and SD ROM streaming. Bring your own .gba files."
          elif [ "$asset" = sonix-game-v1-quicknes-v1.1.0.spk ]; then
            gh release upload sonix-game-store-v1 "candidate/$asset#sonix-ui1|emulator|QuickNES|Optimized NES emulator. Use your own .nes ROMs."
          elif [ "$asset" = sonix-game-v1-quicknes-v1.0.0.spk ]; then
            gh release upload sonix-game-store-v1 "candidate/$asset#sonix-ui1|emulator|QuickNES|Experimental NES and Famicom emulator. Use your own .nes ROMs."
          else
            gh release upload sonix-game-store-v1 "candidate/$asset"
          fi
