name: R1 device binary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'sonix-packer/assets/**'
      - 'extras/reading-fonts/**'
      - 'sonix-player/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-target-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/books-build.yml
  native-readers:
    uses: ./.github/workflows/native-readers.yml
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install target build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config wget texinfo bison flex \
            autoconf automake libtool libtool-bin libgmp-dev libmpfr-dev libmpc-dev \
            xz-utils bzip2 patch python3 p7zip-full squashfs-tools genisoimage binutils
      - name: Restore the player cross toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: sonix-player/rockbox-toolchain
          key: r1-player-toolchain-ubuntu24-${{ hashFiles('sonix-player/rockboxdev/**') }}
      - name: Build only the toolchain dependencies the player uses
        working-directory: sonix-player
        env:
          RBDEV_PLAYER_ONLY: '1'
        run: |
          if [ ! -x rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-g++ ] || \
             [ ! -f rockbox-toolchain/mipsel-rockbox-linux-gnu/sysroot/usr/include/alsa/asoundlib.h ]; then
            chmod +x rockboxdev/rockboxdev.sh
            ./rockboxdev/rockboxdev.sh
          fi
      - name: Save the completed compiler before application or packaging steps
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sonix-player/rockbox-toolchain
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Build MIPS player and enforce device glibc compatibility
        working-directory: sonix-player
        run: |
          chmod +x rockboxdev/rockboxdev.sh
          make target -j2
          make check-abi
          rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-readelf -h -l -d sonix_player > target-elf.txt
          sha256sum sonix_player sonix_launch > target-SHA256SUMS
      - name: Upload device executables (not a firmware image)
        uses: actions/upload-artifact@v4
        with:
          name: sonix-books-r1-device-binary
          path: |
            sonix-player/sonix_player
            sonix-player/sonix_player_debug
            sonix-player/sonix_launch
            sonix-player/target-elf.txt
            sonix-player/target-SHA256SUMS
          retention-days: 30
      - name: Download and pin the known Sonix R1 base
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/Jepl4r/sonix-player/releases/download/1.3.0/r1.upt \
            --output r1-base.upt
          echo '7617a76b212044ea0a3b533eb74cd3d04c28100cc3a08fd058834ef8ba6c4588  r1-base.upt' | sha256sum --check
      - name: Number the test candidate for Wi-Fi version ordering
        env:
          TEST_BUILD: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path('sonix-packer/assets/R1/usr/resource/sonix/components/system-info.json')
          info = json.loads(path.read_text())
          assert re.fullmatch(r'\d+\.\d+\.\d+', info['OS_version'])
          info['OS_version'] += '.' + os.environ['TEST_BUILD']
          path.write_text(json.dumps(info, indent=4) + '\n')
          PY
      - name: Build and independently re-read the R1 candidate
        run: |
          sudo python3 sonix-player/tools/r1_candidate.py --base r1-base.upt \
            --player sonix-player/sonix_player --output r1-candidate
      - name: Upload R1 candidate and audit report (not a stable release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonix-books-r1-candidate
          path: r1-candidate/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload toolchain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r1-toolchain-diagnostics
          path: sonix-player/tmp/rbdev-build/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish-test:
    needs: [checks, target, native-readers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sonix-books-r1-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: sonix-books-offline-dictionary
          path: dictionary-pack
      - uses: actions/download-artifact@v4
        with:
          name: native-reader-r1
          path: native-r1
      - name: Verify the completed candidate for a test release
        env:
          TEST_BUILD: ${{ github.run_number }}
        run: python3 sonix-player/tools/verify_test_release.py candidate --build "$TEST_BUILD" --output test-release.json
      - name: Publish an opt-in Wi-Fi test release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag=$(python3 -c "import json; print(json.load(open('test-release.json'))['tag'])")
          python3 sonix-player/tools/build_sd_packages.py --version "$tag" --output Sonix-Books-SD-Packages.spk \
            extras/reading-fonts/Sonix-Books-Fonts.zip dictionary-pack/Sonix-Books-Dictionary.zip \
            native-r1/Sonix-Books-Native-Readers-r1.zip
          cat > test-notes.md <<'NOTES'
          Experimental Sonix Books firmware for HiBy R1.

          The automated host checks, MIPS build, ABI, firmware size and integrity checks passed.
          This image has NOT passed the R1 hardware checklist. Flashing can still fail.

          After installing a channel-enabled build: Settings > System > Update firmware > Via internet > Test.
          Review the notes, keep a working installer, charge to at least 50%, and keep power stable.
          Stable remains a separate channel. No automatic installation occurs.

          Large reader engines, fonts and dictionaries are outside the internal firmware image.
          The SD Packages asset is verified and installed on the SD card by the Wi-Fi updater.
          When upgrading from an older updater, check for updates again after reboot to install the matching SD packages.
          Custom files under Ebook/Fonts and Ebook/Dictionaries are preserved.
          NOTES
          gh release create "$tag" candidate/r1.upt candidate/SHA256SUMS candidate/r1-build-report.json \
            Sonix-Books-SD-Packages.spk Sonix-Books-SD-Packages.spk.sha256 \
            native-r1/Sonix-Books-Native-Readers-r1.zip native-r1/Sonix-Books-Native-Readers-r1.zip.sha256 \
            extras/reading-fonts/Sonix-Books-Fonts.zip extras/reading-fonts/Sonix-Books-Fonts.zip.sha256 \
            dictionary-pack/Sonix-Books-Dictionary.zip dictionary-pack/Sonix-Books-Dictionary.zip.sha256 \
            --target "$SOURCE_SHA" --prerelease --latest=false --title "Sonix Books $tag (R1 test)" --notes-file test-notes.md
