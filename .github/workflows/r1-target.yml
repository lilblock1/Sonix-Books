name: R1 device binary

on:
  push:
    branches: [main, 'codex/common-book-formats', battery-optimization, downloadable-extras]
    paths:
      - '.github/workflows/**'
      - 'sonix-packer/assets/**'
      - 'extras/reading-fonts/**'
      - 'sonix-player/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-target-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[r1-check]') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/books-build.yml
  native-readers:
    needs: checks
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[r1-check]') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-readers.yml
  target:
    needs: checks
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[r1-check]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install target build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config wget texinfo bison flex \
            autoconf automake libtool libtool-bin libgmp-dev libmpfr-dev libmpc-dev \
            xz-utils bzip2 patch python3 p7zip-full squashfs-tools genisoimage binutils
      - name: Restore the player cross toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: sonix-player/rockbox-toolchain
          key: r1-player-toolchain-ubuntu24-${{ hashFiles('sonix-player/rockboxdev/**') }}
      - name: Build only the toolchain dependencies the player uses
        working-directory: sonix-player
        env:
          RBDEV_PLAYER_ONLY: '1'
        run: |
          if [ ! -x rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-g++ ] || \
             [ ! -f rockbox-toolchain/mipsel-rockbox-linux-gnu/sysroot/usr/include/alsa/asoundlib.h ]; then
            chmod +x rockboxdev/rockboxdev.sh
            ./rockboxdev/rockboxdev.sh
          fi
      - name: Save the completed compiler before application or packaging steps
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sonix-player/rockbox-toolchain
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Build MIPS player and enforce device glibc compatibility
        working-directory: sonix-player
        run: |
          chmod +x rockboxdev/rockboxdev.sh
          make target -j2
          make check-abi
          rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-readelf -h -l -d sonix_player > target-elf.txt
          sha256sum sonix_player sonix_launch > target-SHA256SUMS
      - name: Upload device executables (not a firmware image)
        uses: actions/upload-artifact@v4
        with:
          name: sonix-books-r1-device-binary
          path: |
            sonix-player/sonix_player
            sonix-player/sonix_player_debug
            sonix-player/sonix_launch
            sonix-player/target-elf.txt
            sonix-player/target-SHA256SUMS
          retention-days: 30
      - name: Download and pin the known Sonix R1 base
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/Jepl4r/sonix-player/releases/download/1.3.0/r1.upt \
            --output r1-base.upt
          echo '7617a76b212044ea0a3b533eb74cd3d04c28100cc3a08fd058834ef8ba6c4588  r1-base.upt' | sha256sum --check
      - name: Number the test candidate for Wi-Fi version ordering
        env:
          TEST_BUILD: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path('sonix-packer/assets/R1/usr/resource/sonix/components/system-info.json')
          info = json.loads(path.read_text())
          assert re.fullmatch(r'\d+\.\d+\.\d+', info['OS_version'])
          info['OS_version'] += '.' + os.environ['TEST_BUILD']
          path.write_text(json.dumps(info, indent=4) + '\n')
          PY
      - name: Build and independently re-read the R1 candidate
        run: |
          sudo python3 sonix-player/tools/r1_candidate.py --base r1-base.upt \
            --player sonix-player/sonix_player --output r1-candidate
      - name: Upload R1 candidate and audit report (not a stable release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonix-books-r1-candidate
          path: r1-candidate/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload toolchain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r1-toolchain-diagnostics
          path: sonix-player/tmp/rbdev-build/*.log
          if-no-files-found: ignore
          retention-days: 7

  sd-packages:
    needs: [checks, target, native-readers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sonix-books-r1-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: sonix-books-offline-dictionary
          path: dictionary-pack
      - uses: actions/download-artifact@v4
        with:
          name: native-reader-r1
          path: native-r1
      - name: Build the SD bundle for this exact firmware candidate
        env:
          TEST_BUILD: ${{ github.run_number }}
        run: |
          python3 sonix-player/tools/verify_test_release.py candidate --build "$TEST_BUILD" --output test-release.json
          tag=$(python3 -c "import json; print(json.load(open('test-release.json'))['tag'])")
          python3 sonix-player/tools/build_sd_packages.py --version "$tag" --output Sonix-Books-SD-Packages.spk \
            extras/reading-fonts/Sonix-Books-Fonts.zip dictionary-pack/Sonix-Books-Dictionary.zip \
            native-r1/Sonix-Books-Native-Readers-r1.zip > sd-packages-report.json
          mkdir -p individual-extras
          python3 sonix-player/tools/build_sd_packages.py --version "$tag" --component Fonts --output individual-extras/Sonix-Books-Extra-Fonts.spk extras/reading-fonts/Sonix-Books-Fonts.zip > individual-extras/fonts-report.json
          python3 sonix-player/tools/build_sd_packages.py --version "$tag" --component Dictionaries --output individual-extras/Sonix-Books-Extra-Dictionary.spk dictionary-pack/Sonix-Books-Dictionary.zip > individual-extras/dictionary-report.json
          python3 sonix-player/tools/build_sd_packages.py --version "$tag" --component Tools --output individual-extras/Sonix-Books-Extra-Readers.spk native-r1/Sonix-Books-Native-Readers-r1.zip > individual-extras/readers-report.json
      - name: Install the complete production bundle with the real streaming installer
        working-directory: sonix-player
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I. tests/sdpackages_driver.c \
            src/system/device/sdpackages.c src/system/device/sdpackages_paths.c \
            src/system/core/json.c src/system/core/sha256.c -o sd-install-check
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          report = json.loads(pathlib.Path('../sd-packages-report.json').read_text())
          with tempfile.TemporaryDirectory() as card:
              result = subprocess.check_output(['./sd-install-check', card, '../Sonix-Books-SD-Packages.spk',
                  report['version'], report['sha256'], '0'], text=True).strip()
              assert result == '0 ' + report['version'], result
          print(report)
          PY
      - name: Install each production extra independently on a clean card
        working-directory: sonix-player
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          packages = pathlib.Path('../individual-extras')
          names = ('Fonts', 'Dictionary', 'Readers')
          reports = ('fonts', 'dictionary', 'readers')
          folders = ('packages-fonts', 'packages-dictionaries', 'packages-tools')
          with tempfile.TemporaryDirectory() as temporary:
              card = pathlib.Path(temporary)
              for i, (name, report_name) in enumerate(zip(names, reports)):
                  report = json.loads((packages / (report_name + '-report.json')).read_text())
                  asset = packages / ('Sonix-Books-Extra-' + name + '.spk')
                  result = subprocess.check_output(['./sd-install-check', str(card), str(asset),
                      report['version'], report['sha256'], '0', str(i)], text=True).strip()
                  assert result == '0 ' + report['version'], result
                  assert {p.name for p in (card / '.sonix').iterdir()} == set(folders[:i+1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sonix-books-individual-extras
          path: individual-extras/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: sonix-books-sd-packages
          path: |
            Sonix-Books-SD-Packages.spk
            Sonix-Books-SD-Packages.spk.sha256
            sd-packages-report.json
          retention-days: 30

  publish-test:
    needs: [checks, target, native-readers, sd-packages]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/downloadable-extras' && contains(github.event.head_commit.message, '[r1-publish-test]')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sonix-books-r1-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: sonix-books-offline-dictionary
          path: dictionary-pack
      - uses: actions/download-artifact@v4
        with:
          name: native-reader-r1
          path: native-r1
      - uses: actions/download-artifact@v4
        with:
          name: sonix-books-sd-packages
          path: sd-packages
      - uses: actions/download-artifact@v4
        with:
          name: sonix-books-individual-extras
          path: individual-extras
      - name: Verify the completed candidate for a test release
        env:
          TEST_BUILD: ${{ github.run_number }}
        run: python3 sonix-player/tools/verify_test_release.py candidate --build "$TEST_BUILD" --output test-release.json
      - name: Publish an opt-in Wi-Fi test release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag=$(python3 -c "import json; print(json.load(open('test-release.json'))['tag'])")
          cat > test-notes.md <<'NOTES'
          Experimental Sonix Books firmware for HiBy R1.

          The automated host checks, MIPS build, ABI, firmware size and integrity checks passed.
          This image has NOT passed the R1 hardware checklist. Flashing can still fail.

          After installing a channel-enabled build: Settings > System > Update firmware > Via internet > Test.
          Review the notes, keep a working installer, charge to at least 50%, and keep power stable.
          Stable remains a separate channel. No automatic installation occurs.

          Update 12 test: redesigned Game Store with game/emulator categories, logos, package details and explicit install/update confirmation. The Game Launcher uses title-specific controls (2048 has only directions, Undo, New game and Exit) and logo tiles.
          Refresh the Game Store to discover new games and versions without flashing firmware. Artwork is optional and falls back to locally drawn or built-in icons. Existing Update 11 packages remain compatible.
          Optional reader engines, fonts and dictionaries are distributed as separate verified SD packages. Use Downloadable Extras after reboot to select them.
          Existing custom files and save files are outside managed package generations. Native game execution and R1 controls still require physical testing.
          NOTES
          # A pre-Update-11 updater would automatically fetch a combined bundle.
          # Keep that bundle as a CI artifact; install individual SD extras only when selected.
          gh release create "$tag" candidate/r1.upt candidate/SHA256SUMS candidate/r1-build-report.json \
            individual-extras/*.spk individual-extras/*.sha256 individual-extras/*-report.json \
            native-r1/Sonix-Books-Native-Readers-r1.zip native-r1/Sonix-Books-Native-Readers-r1.zip.sha256 \
            extras/reading-fonts/Sonix-Books-Fonts.zip extras/reading-fonts/Sonix-Books-Fonts.zip.sha256 \
            dictionary-pack/Sonix-Books-Dictionary.zip dictionary-pack/Sonix-Books-Dictionary.zip.sha256 \
            --target "$SOURCE_SHA" --prerelease --latest=false --title "Sonix Books $tag (Update 12 R1 test)" --notes-file test-notes.md
